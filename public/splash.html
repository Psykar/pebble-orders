<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pebble Shipping Dashboard</title>
    <link rel="modulepreload" href="splash.js">
    <style>
    body {
      margin: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #111125;
      color: #e0e0f0;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    main {
      display: grid;
      gap: 1rem;
      justify-items: center;
      text-align: center;
      padding: 1rem;
    }
    h1 {
      margin: 0;
      font-size: 1.4rem;
    }
    #summary {
      margin: 0;
      color: #8888aa;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 0.7rem 1.4rem;
      background: #4ecdc4;
      color: #111125;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    </style>
  </head>
  <body>
    <main>
      <h1>Pebble Shipping Dashboard</h1>
      <p id="summary">Loading reports…</p>
      <button id="start-btn" type="button">Open dashboard</button>
    </main>
    <script src="splash.js" type="module"></script>
  </body>
</html>
